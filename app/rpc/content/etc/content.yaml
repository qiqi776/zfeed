Name: content.rpc
ListenOn: "${CONTENT_RPC_LISTEN_ON}"

Telemetry:
  Name: content-rpc
  Disabled: ${OTEL_DISABLED}
  Endpoint: "${OTEL_ENDPOINT}"
  Batcher: otlpgrpc
  Sampler: 1.0

Prometheus:
  Host: "${PROM_HOST}"
  Port: ${CONTENT_PROM_PORT}
  Path: /metrics

Log:
  ServiceName: "content-rpc"
  Mode: "file"
  Encoding: "json"
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"
  Path: "${LOG_PATH}/content-rpc"
  Level: "info"
  MaxContentLength: 0
  Compress: false
  Stat: true
  KeepDays: 1
  StackCooldownMillis: 100
  MaxBackups: 0
  MaxSize: 0
  Rotation: "daily"
  FileTimeFormat: "2006-01-02T15:04:05.000Z07:00"

Etcd:
  Hosts:
    - "${ETCD_HOST}:${ETCD_PORT}"
  Key: content.rpc

InteractionRpcClientConf:
  Etcd:
    Hosts:
      - "${ETCD_HOST}:${ETCD_PORT}"
    Key: interaction.rpc
  NonBlock: true

UserRpcClientConf:
  Etcd:
    Hosts:
      - "${ETCD_HOST}:${ETCD_PORT}"
    Key: user.rpc
  NonBlock: true

CountRpcClientConf:
  Etcd:
    Hosts:
      - "${ETCD_HOST}:${ETCD_PORT}"
    Key: count.rpc
  NonBlock: true

Oss:
  Provider: ""
  Region: ""
  BucketName: ""
  AccessKeyId: ""
  AccessKeySecret: ""
  Endpoint: ""
  UploadDir: ""
  PublicHost: ""

RedisConfig:
  Host: "${REDIS_HOST}:${REDIS_PORT}"
  Type: node
  Pass: ""

KqProducerConf:
  Brokers:
    - "${KAFKA_BROKERS}"
  Topic: zfeed-rec-track
  MaxRetries: 3

KqConsumerConf:
  Name: content-rec-track-consumer
  Brokers:
    - "${KAFKA_BROKERS}"
  Group: zfeed-content-rec-track-consumer
  Topic: zfeed-rec-track
  Offset: last
  Consumers: 2
  Processors: 2

KqUserActionConsumerConf:
  Name: content-user-action-consumer
  Brokers:
    - "${KAFKA_BROKERS}"
  Group: zfeed-content-user-action-consumer
  Topic: zfeed-user-action
  Offset: last
  Consumers: 2
  Processors: 2

MySQL:
  DataSource: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_APP_PORT})/zfeed?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"

XxlJob:
  AppName: zfeed-content-cron
  Address: "${XXL_EXECUTOR_ADDRESS}"
  RegistryAddress: "${XXL_EXECUTOR_REGISTRY_ADDRESS}"
  IP: "${XXL_EXECUTOR_IP}"
  Port: ${XXL_EXECUTOR_PORT}
  AccessToken: "${XXL_JOB_ACCESS_TOKEN}"
  AdminAddresses:
    - "${XXL_JOB_ADMIN_ADDR}"
  RegistryInterval: 30s
  HTTPTimeout: 10s

Recommend:
  Enabled: false
  TimeoutMs: 120
  SnapshotTTL: 600
  CandidateTTL: 300
  CandidateLimit: 500
  FallbackToHot: true
  ColdStartMetaTTL: 604800
  SeenTTL: 604800
  Hot:
    Enabled: true
    Weight: 0.55
    Limit: 300
  NewContent:
    Enabled: true
    Weight: 0.2
    Limit: 100
  Interest:
    Enabled: false
    Weight: 0.25
    Limit: 200
    TopTags: 8
    MinTags: 3
    ProfileTTL: 2592000
    ContentTagTTL: 2592000
    TagIndexTTL: 604800
  Rank:
    CoarseLimit: 200
    AlphaHot: 0.45
    BetaInterest: 0.30
    GammaFresh: 0.20
    DeltaQuality: 0.05
    SeenPenalty: 0.3
    RepeatedSeenFilterN: 2
  Diversity:
    Enabled: true
    AuthorWindow: 5
    MaxSameAuthor: 1
    TypeWindow: 6
    MaxSameType: 4
    NewContentTopN: 20
    NewContentMinCount: 2
  Experiment:
    ID: exp_rec_v1
    Enabled: false
    Salt: zfeed_20260531
    TrafficPermyriad: 10000
    TrafficPercent: 100
    DefaultVariant: control
    Variants:
      - ID: a
        TrafficPermyriad: 5000
        TrafficPercent: 50
        Overrides:
          recall.interest.weight: "0.20"
          rank.beta_interest: "0.25"
      - ID: b
        TrafficPermyriad: 5000
        TrafficPercent: 50
        Overrides:
          recall.interest.weight: "0.35"
          rank.beta_interest: "0.40"
          diversity.new_content_min_count: "3"
