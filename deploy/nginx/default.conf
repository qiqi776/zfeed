map $http_x_request_id $trace_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

log_format zfeed_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"request_id":"$trace_request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"body_bytes_sent":$body_bytes_sent,'
    '"traceparent":"$http_traceparent",'
    '"user_agent":"$http_user_agent"'
  '}';

upstream front_api_upstream {
  server front-api:5000;
  keepalive 32;
}

upstream admin_api_upstream {
  server admin-api:5001;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  
  access_log /var/log/nginx/access.log zfeed_access;
  error_log /var/log/nginx/error.log warn;

  proxy_connect_timeout 3s;
  proxy_send_timeout 110s;
  proxy_read_timeout 110s;
  send_timeout 110s;

  client_max_body_size 20m;

  location = /v1/users/avatar/upload {
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $trace_request_id;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    add_header X-Request-Id $trace_request_id always;
    proxy_pass http://front_api_upstream;
  }

  location /v1/admin/ {
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $trace_request_id;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    add_header X-Request-Id $trace_request_id always;
    proxy_pass http://admin_api_upstream;
  }

  location /v1/ {
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $trace_request_id;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    add_header X-Request-Id $trace_request_id always;
    proxy_pass http://front_api_upstream;
  }

  location / {
    return 404;
  }
}
